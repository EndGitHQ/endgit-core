services:
  postgres:
    image: postgres:16-alpine
    container_name: endgit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: endgit
      POSTGRES_USER: endgit
      POSTGRES_PASSWORD: endgit
    ports:
      - "5432:5432"
    volumes:
      - endgit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endgit -d endgit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  endgit_postgres_data: {}
