basePath: /api/v1
definitions:
  handlers.BuildDetailsResponse:
    properties:
      artifactSize:
        type: integer
      artifactSizeLinux:
        type: integer
      artifactSizeWin:
        type: integer
      artifactUrl:
        type: string
      artifactUrlLinux:
        type: string
      artifactUrlWin:
        type: string
      branch:
        type: string
      buildNumber:
        type: integer
      commitHash:
        type: string
      commitMessage:
        type: string
      createdAt:
        type: string
      duration:
        type: integer
      finishedAt:
        type: string
      ghActionsRunId:
        type: string
      id:
        type: string
      isRelease:
        type: boolean
      linuxBuildStatus:
        type: string
      logs:
        type: string
      pluginId:
        type: string
      safeScore:
        type: integer
      scanResults:
        type: string
      status:
        type: string
      triggerType:
        type: string
      winBuildStatus:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.HealthResponse:
    properties:
      database:
        example: ok
        type: string
      status:
        example: ok
        type: string
      uptime:
        example: 1725571200
        type: integer
    type: object
  handlers.HealthUnavailableResponse:
    properties:
      database:
        example: not ok
        type: string
      status:
        example: not ok
        type: string
      uptime:
        example: 1725571200
        type: integer
    type: object
  handlers.ListPluginsResponse:
    properties:
      count:
        type: integer
      items:
        items:
          $ref: '#/definitions/handlers.PluginListItem'
        type: array
      limit:
        type: integer
      offset:
        type: integer
    type: object
  handlers.PluginDetailsResponse:
    properties:
      authorId:
        type: string
      commentCount:
        type: integer
      createdAt:
        type: string
      description:
        type: string
      displayName:
        type: string
      downloads:
        type: integer
      iconUrl:
        type: string
      id:
        type: string
      isFeatured:
        type: boolean
      isVerified:
        type: boolean
      keywords:
        items:
          type: string
        type: array
      license:
        type: string
      longDescription:
        type: string
      name:
        type: string
      pluginType:
        type: string
      qualityBadge:
        type: string
      repoUrl:
        type: string
      reviewBuildId:
        type: string
      slug:
        type: string
      stars:
        type: integer
      status:
        type: string
      statusReason:
        type: string
      tags:
        items:
          type: string
        type: array
      trustScore:
        type: number
      updatedAt:
        type: string
      webhookId:
        type: string
    type: object
  handlers.PluginListItem:
    properties:
      authorId:
        type: string
      description:
        type: string
      displayName:
        type: string
      downloads:
        type: integer
      iconUrl:
        type: string
      id:
        type: string
      isFeatured:
        type: boolean
      isVerified:
        type: boolean
      keywords:
        items:
          type: string
        type: array
      name:
        type: string
      pluginType:
        type: string
      slug:
        type: string
      stars:
        type: integer
    type: object
info:
  contact: {}
  description: Backend API for EndGit services.
  title: EndGit API
  version: 0.1.0
paths:
  /builds/{id}:
    get:
      description: Returns details for a build by ID.
      parameters:
      - description: Build ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BuildDetailsResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Build details
      tags:
      - builds
  /health:
    get:
      description: Returns service health status and runtime metadata.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.HealthUnavailableResponse'
      summary: Service health check
      tags:
      - health
  /plugins:
    get:
      description: Returns a paginated list of plugins.
      parameters:
      - description: Number of items (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Pagination offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ListPluginsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: List plugins
      tags:
      - plugins
  /plugins/{slug}:
    get:
      description: Returns details for a plugin by slug.
      parameters:
      - description: Plugin slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PluginDetailsResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Plugin details
      tags:
      - plugins
swagger: "2.0"
